<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lojinha de FTF Confiável</title>
  <script src="https://jsdelivr.net"></script>
  <style>
    body { background-color: #120909; color: #fff; font-family: sans-serif; margin: 0; padding-bottom: 90px; }
    header { text-align: center; padding: 25px 15px; background: linear-gradient(180deg, #2b1111 0%, #120909 100%); }
    h1 { margin: 0; font-size: 24px; text-transform: uppercase; }
    .sub { color: #ccc; font-size: 14px; margin: 5px 0 15px; }
    .badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .badge { background: rgba(255,255,255,0.1); border: 1px solid #ff4444; padding: 5px 12px; border-radius: 20px; font-size: 12px; }
    .categorias { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 15px; }
    .cat-btn { background: #1f1212; color: #fff; border: 1px solid #442222; padding: 8px 16px; border-radius: 20px; cursor: pointer; }
    .cat-btn.ativo { background: #d92626; border-color: #ff5555; font-weight: bold; }
    .catalogo { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding: 15px; }
    .card { background: #1c1010; border: 1px solid #381c1c; border-radius: 12px; padding: 12px; text-align: center; }
    .card h3 { font-size: 15px; margin: 8px 0 4px; }
    .card .preco { color: #4ade80; font-weight: bold; font-size: 16px; margin-bottom: 10px; }
    .btn-add { background: #d92626; color: #fff; border: none; padding: 8px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .rodape-carrinho { position: fixed; bottom: 0; left: 0; right: 0; background: #1a0d0d; border-top: 1px solid #381c1c; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; }
    .btn-finalizar { background: #d92626; color: #fff; border: none; padding: 12px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    .btn-admin { background: #2b1111; border: 1px solid #d92626; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; display: block; margin: 20px auto; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); padding: 20px; overflow-y: auto; z-index: 100; }
    .modal-box { background: #1f1212; padding: 20px; border-radius: 12px; max-width: 400px; margin: 20px auto; border: 1px solid #d92626; }
    input, select { width: 100%; padding: 10px; margin: 6px 0 12px; border-radius: 6px; border: 1px solid #442222; background: #120909; color: #fff; box-sizing: border-box; }
    .item-admin { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #331919; font-size: 14px; }
  </style>
</head>
<body>

  <header>
    <h1>🪚 Lojinha de FTF Confiável 🩸</h1>
    <div class="sub">@lojinha_deftf_confiavel • Catálogo Oficial</div>
    <div class="badges">
      <span class="badge">⚡ Entrega via Trade</span>
      <span class="badge">👑 Cupom VIP: VIP10 (10% OFF)</span>
      <span class="badge">🔨 100% Segura</span>
    </div>
  </header>

  <div class="categorias">
    <button class="cat-btn ativo" onclick="filtrar('Todos', this)">Todos</button>
    <button class="cat-btn" onclick="filtrar('Raridades Top', this)">Raridades Top</button>
    <button class="cat-btn" onclick="filtrar('Halloween & Eventos', this)">Halloween & Eventos</button>
    <button class="cat-btn" onclick="filtrar('Simples & Comuns', this)">Simples & Comuns</button>
  </div>

  <div class="catalogo" id="lista-produtos">
    <p style="text-align:center; width:100%; color:#aaa;">Carregando itens da loja...</p>
  </div>

  <button class="btn-admin" onclick="abrirAdmin()">⚙️ Painel do Dono (Adicionar / Editar Itens)</button>

  <div class="rodape-carrinho">
    <div>
      <div style="font-size: 12px; color: #aaa;">Seu Carrinho (<span id="qtd-itens">0</span> itens)</div>
      <div style="color: #4ade80; font-weight: bold; font-size: 18px;">Total: R$ <span id="valor-total">0.00</span></div>
    </div>
    <button class="btn-finalizar" onclick="finalizarPedido()">Finalizar Pedido 🛒</button>
  </div>

  <!-- Painel do Dono -->
  <div class="modal" id="modal-admin">
    <div class="modal-box">
      <h3>⚙️ Configuração do Dono</h3>
      <input type="text" id="novo-nome" placeholder="Nome da Marreta / Set">
      <input type="number" id="novo-preco" step="0.01" placeholder="Preço (Ex: 15.00)">
      <select id="novo-cat">
        <option value="Raridades Top">Raridades Top</option>
        <option value="Halloween & Eventos">Halloween & Eventos</option>
        <option value="Simples & Comuns">Simples & Comuns</option>
      </select>
      <button class="btn-add" onclick="adicionarProduto()">+ Publicar na Loja</button>

      <h4 style="margin-top:20px;">Itens no Banco de Dados</h4>
      <div id="admin-lista"></div>

      <button class="btn-add" style="background:#444; margin-top:15px;" onclick="fecharAdmin()">Voltar para a Loja</button>
    </div>
  </div>

  <script>
    // 1. CONFIGURAÇÃO DO SUPABASE E DA LOJA
    const SUPABASE_URL = "https://supabase.co";
    const SUPABASE_ANON_KEY = "COLE_SUA_CHAVE_ANON_AQUI"; // <-- Cole sua chave sb_publishable_... aqui
    const SENHA_DONO = "1234"; // Senha para entrar no seu painel
    const WHATSAPP_DONO = "5521999999999"; // Coloque seu número com DDD

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let produtos = [];
    let carrinho = [];
    let categoriaAtual = 'Todos';

    async function carregarProdutos() {
      const { data, error } = await db.from('produtos').select('*').order('id', { ascending: false });
      if (error) {
        document.getElementById('lista-produtos').innerHTML = `<p style="color:#ff5555; text-align:center;">Erro ao conectar no banco: ${error.message}</p>`;
        return;
      }
      produtos = data || [];
      renderizar();
    }

    function renderizar() {
      const container = document.getElementById('lista-produtos');
      container.innerHTML = '';
      const filtrados = categoriaAtual === 'Todos' ? produtos : produtos.filter(p => p.categoria === categoriaAtual);

      if (filtrados.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#aaa; grid-column: 1/-1;">Nenhum item cadastrado nesta categoria ainda. Use o Painel do Dono abaixo para adicionar.</p>';
        return;
      }

      filtrados.forEach(p => {
        container.innerHTML += `
          <div class="card">
            <div style="font-size: 32px;">🔨</div>
            <h3>${p.nome}</h3>
            <div style="font-size: 11px; color: #aaa;">${p.categoria}</div>
            <div class="preco">R$ ${Number(p.preco).toFixed(2)}</div>
            <button class="btn-add" onclick="addCarrinho(${p.id})">Adicionar</button>
          </div>
        `;
      });
    }

    function filtrar(cat, btn) {
      categoriaAtual = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('ativo'));
      btn.classList.add('ativo');
      renderizar();
    }

    function addCarrinho(id) {
      const item = produtos.find(p => p.id === id);
      if (item) {
        carrinho.push(item);
        document.getElementById('qtd-itens').innerText = carrinho.length;
        const total = carrinho.reduce((acc, i) => acc + Number(i.preco), 0);
        document.getElementById('valor-total').innerText = total.toFixed(2);
      }
    }

    function finalizarPedido() {
      if (carrinho.length === 0) return alert("Seu carrinho está vazio!");
      let cupom = prompt("Tem cupom de desconto? (Digite VIP10 ou deixe em branco)");
      let total = carrinho.reduce((acc, i) => acc + Number(i.preco), 0);
      let textoDesconto = "";

      if (cupom && cupom.toUpperCase() === "VIP10") {
        total = total * 0.90;
        textoDesconto = "%0A🎟️ *Cupom aplicado:* VIP10 (10% OFF)";
      }

      let listaTexto = carrinho.map(i => `- ${i.nome} (R$ ${Number(i.preco).toFixed(2)})`).join('%0A');
      let msg = `Olá! Vim pela *Lojinha de FTF Confiável* e quero fazer um pedido:%0A%0A${listaTexto}${textoDesconto}%0A%0A💰 *Total a pagar:* R$ ${total.toFixed(2)}`;
      
      window.open(`https://wa.me{WHATSAPP_DONO}?text=${msg}`, '_blank');
    }

    // Funções Exclusivas do Dono
    function abrirAdmin() {
      const senha = prompt("Digite a senha de administrador:");
      if (senha !== SENHA_DONO) return alert("Senha incorreta!");
      atualizarListaAdmin();
      document.getElementById('modal-admin').style.display = 'block';
    }

    function fecharAdmin() {
      document.getElementById('modal-admin').style.display = 'none';
    }

    async function adicionarProduto() {
      const nome = document.getElementById('novo-nome').value;
      const preco = parseFloat(document.getElementById('novo-preco').value);
      const categoria = document.getElementById('novo-cat').value;
      if (!nome || isNaN(preco)) return alert("Preencha o nome e o preço!");

      const { error } = await db.from('produtos').insert([{ nome, preco, categoria }]);
      if (error) return alert("Erro ao salvar no Supabase: " + error.message);

      document.getElementById('novo-nome').value = '';
      document.getElementById('novo-preco').value = '';
      await carregarProdutos();
      atualizarListaAdmin();
    }

    async function removerProduto(id) {
      const { error } = await db.from('produtos').delete().eq('id', id);
      if (error) return alert("Erro ao apagar: " + error.message);
      await carregarProdutos();
      atualizarListaAdmin();
    }

    function atualizarListaAdmin() {
      const div = document.getElementById('admin-lista');
      div.innerHTML = produtos.map(p => `
        <div class="item-admin">
          <span>${p.nome} - R$ ${Number(p.preco).toFixed(2)}</span>
